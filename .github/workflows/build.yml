name: Build
permissions:
  contents: write # To submit dependency graph
  checks: write # To publish test results
  pull-requests: write # To comment on PRs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    uses: BIBSYSDEV/nva-github-workflows/.github/workflows/java.yml@f5d23b2c1ce8f004fd0a93e58a827be3b48ba621 # v2
    with:
      java_version: "25"
      lint_openapi: false
    secrets:
      codacy_token: ${{ secrets.CODACY_PROJECT_TOKEN }}
