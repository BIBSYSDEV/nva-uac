name: Build
permissions:
  contents: write # To submit dependency graph
  checks: write # To publish test results
  pull-requests: write # To comment on PRs

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    uses: BIBSYSDEV/nva-github-workflows/.github/workflows/java.yml@57f2b5e4d1704d1e98da3e38996beb24aef3bf5e # v2
    with:
      java_version: "25"
    secrets:
      codacy_token: ${{ secrets.CODACY_PROJECT_TOKEN }}
