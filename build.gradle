plugins {
    id 'nva.uac.root-conventions'
}

// The templates are not a Gradle project, since the shared root conventions aggregate coverage
// over every subproject; they are linted from here instead
def templateLints = [
    lintDataTier: 'infrastructure/data-tier.yaml',
    lintTemplate: 'template.yaml'
].collect { taskName, template ->
    tasks.register(taskName, Exec) {
        group = 'verification'
        description = "Lints ${template} with sam validate --lint"
        def validated = layout.buildDirectory.file("lint/${template}.validated")
        inputs.file(template)
        outputs.file(validated)
        commandLine 'sam', 'validate', '--lint', '--template-file', template
        doLast {
            validated.get().asFile.text = 'validated'
        }
    }
}

tasks.register('lintInfrastructure') {
    group = 'verification'
    description = 'Lints every CloudFormation and SAM template; needs the SAM CLI on the path'
    dependsOn templateLints
}
