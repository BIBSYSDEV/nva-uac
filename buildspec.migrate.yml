version: 0.2

# Applies the migrations, or drops a branch schema when DROP_SCHEMA is "true", in the migration
# project the application stack defines: inside the data tier's VPC, as the master user through
# the proxy with an IAM token (ADR 0005). The Migration custom resource starts it during a
# deploy and passes the CloudFormation response fields; started by hand, they stay empty and no
# response is sent.

env:
  variables:
    GRADLE_USER_HOME: "/root/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.configuration-cache=false"
    SCHEMA_NAME: public
    DROP_SCHEMA: "false"
    CFN_RESPONSE_URL: ""
    CFN_STACK_ID: ""
    CFN_REQUEST_ID: ""
    CFN_LOGICAL_ID: ""
    CFN_PHYSICAL_ID: ""
  parameter-store:
    PROXY_ENDPOINT: /NVA/UAC/Database/ProxyEndpoint
    DATABASE_NAME: /NVA/UAC/Database/Name
    DATABASE_USER: /NVA/UAC/Database/MasterUsername
cache:
  paths:
    - "/root/.gradle/caches/**/*"
phases:
  install:
    runtime-versions:
      java: corretto25
  build:
    commands:
      - if [ "$DROP_SCHEMA" = "true" ] && [ "$SCHEMA_NAME" = "public" ]; then echo "Refusing to drop the public schema" >&2; exit 1; fi
      - if [ "$DROP_SCHEMA" = "true" ]; then TASK=flywayClean; CLEAN_DISABLED=false; else TASK=flywayMigrate; CLEAN_DISABLED=true; fi
      - export FLYWAY_URL="jdbc:postgresql://${PROXY_ENDPOINT}:5432/${DATABASE_NAME}?sslmode=require"
      - export FLYWAY_USER="$DATABASE_USER"
      - export FLYWAY_SCHEMAS="$SCHEMA_NAME"
      - export FLYWAY_CLEAN_DISABLED="$CLEAN_DISABLED"
      - export FLYWAY_PASSWORD=$(aws rds generate-db-auth-token --hostname "$PROXY_ENDPOINT" --port 5432 --username "$DATABASE_USER" --region "$AWS_REGION")
      - ./gradlew ":adapter-persistence-postgres:$TASK"
  post_build:
    commands:
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then STATUS=SUCCESS; else STATUS=FAILED; fi
      - RESPONSE=$(printf '{"Status":"%s","Reason":"See CodeBuild build %s","PhysicalResourceId":"%s","StackId":"%s","RequestId":"%s","LogicalResourceId":"%s"}' "$STATUS" "$CODEBUILD_BUILD_ID" "$CFN_PHYSICAL_ID" "$CFN_STACK_ID" "$CFN_REQUEST_ID" "$CFN_LOGICAL_ID")
      - if [ -n "$CFN_RESPONSE_URL" ]; then curl --silent --show-error --fail --request PUT --header 'Content-Type:' --data-binary "$RESPONSE" "$CFN_RESPONSE_URL"; fi
