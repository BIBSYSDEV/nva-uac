[versions]
quarkus = "3.40.1"
jooq = "3.21.9"
flyway = "13.10.3"
postgresql-driver = "42.7.14"
jooq-gradle-plugin = "10.2.1"

[libraries]
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-gradle-plugin = { module = "io.quarkus:gradle-application-plugin", version.ref = "quarkus" }
quarkus-jacoco = { module = "io.quarkus:quarkus-jacoco" }
quarkus-junit5 = { module = "io.quarkus:quarkus-junit5" }
quarkus-rest = { module = "io.quarkus:quarkus-rest" }
quarkus-rest-jackson = { module = "io.quarkus:quarkus-rest-jackson" }
quarkus-smallrye-openapi = { module = "io.quarkus:quarkus-smallrye-openapi" }
quarkus-oidc = { module = "io.quarkus:quarkus-oidc" }
quarkus-test-oidc-server = { module = "io.quarkus:quarkus-test-oidc-server" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }
rest-assured = { module = "io.rest-assured:rest-assured" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-meta-extensions = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
jooq-gradle-plugin = { module = "nu.studer:gradle-jooq-plugin", version.ref = "jooq-gradle-plugin" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
flyway-gradle-plugin = { module = "org.flywaydb:flyway-gradle-plugin", version.ref = "flyway" }
postgresql-driver = { module = "org.postgresql:postgresql", version.ref = "postgresql-driver" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql" }
smallrye-jwt-build = { module = "io.smallrye:smallrye-jwt-build" }
quarkus-agroal = { module = "io.quarkus:quarkus-agroal" }
quarkus-jdbc-postgresql = { module = "io.quarkus:quarkus-jdbc-postgresql" }
quarkus-flyway = { module = "io.quarkus:quarkus-flyway" }
quarkus-smallrye-health = { module = "io.quarkus:quarkus-smallrye-health" }
quarkus-amazon-lambda-http = { module = "io.quarkus:quarkus-amazon-lambda-http" }
quarkus-container-image-jib = { module = "io.quarkus:quarkus-container-image-jib" }
