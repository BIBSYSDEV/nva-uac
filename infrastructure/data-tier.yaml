AWSTemplateFormatVersion: "2010-09-09"
Description: >
  nva-uac data tier: Aurora PostgreSQL Serverless v2 with a writer and a reader, behind RDS Proxy,
  encrypted with the AWS-managed keys. Deployed once per account; the application stacks read its
  outputs from SSM. The VPC and subnets are inputs, so a shared network or a dedicated one both
  fit.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC the database, the proxy and the application run in.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets in at least two availability zones.
  EngineVersion:
    Type: String
    Default: "17.5"
    Description: Aurora PostgreSQL engine version; the same major version as the local tests use.
  MinCapacity:
    Type: Number
    Default: 0.5
    Description: Minimum Aurora capacity units per instance.
  MaxCapacity:
    Type: Number
    Default: 4
    Description: Maximum Aurora capacity units per instance.
  DatabaseName:
    Type: String
    Default: nvauac
    AllowedPattern: "^[a-z][a-z0-9_]{0,62}$"
    Description: Fixed at the first deployment; a change replaces the cluster.
  MasterUsername:
    Type: String
    Default: nvauac_admin
    AllowedPattern: "^[a-z][a-z0-9_]{0,62}$"
    Description: Fixed at the first deployment; a change replaces the cluster.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, e2e, sandbox, prod]
    Description: Names the cluster and the proxy; decides deletion protection and backup retention.
  LogRetentionDays:
    Type: Number
    Default: 30
    Description: How long the PostgreSQL log is kept in CloudWatch Logs.

Conditions:
  IsProduction: !Equals [!Ref Environment, prod]

Resources:
  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: nva-uac application; may reach the proxy and the internet for the issuer.
      VpcId: !Ref VpcId

  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: nva-uac RDS Proxy; reachable from the application only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApplicationSecurityGroup

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: nva-uac Aurora cluster; reachable from the proxy only.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ProxySecurityGroup

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: nva-uac private subnets
      SubnetIds: !Ref PrivateSubnetIds

  ClusterLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/rds/cluster/nva-uac-${Environment}/postgresql"
      RetentionInDays: !Ref LogRetentionDays

  Cluster:
    Type: AWS::RDS::DBCluster
    DependsOn: ClusterLogGroup
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBClusterIdentifier: !Sub "nva-uac-${Environment}"
      Engine: aurora-postgresql
      EngineVersion: !Ref EngineVersion
      DatabaseName: !Ref DatabaseName
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DatabaseSecurityGroup
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
      ManageMasterUserPassword: true
      MasterUsername: !Ref MasterUsername
      StorageEncrypted: true
      BackupRetentionPeriod: !If [IsProduction, 35, 7]
      DeletionProtection: !If [IsProduction, true, false]
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports:
        - postgresql

  Writer:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref Cluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      PromotionTier: 0

  Reader:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref Cluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      PromotionTier: 1

  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadDatabaseCredentials
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Cluster.MasterUserSecret.SecretArn

  Proxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "nva-uac-${Environment}"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt ProxyRole.Arn
      Auth:
        - AuthScheme: SECRETS
          IAMAuth: REQUIRED
          SecretArn: !GetAtt Cluster.MasterUserSecret.SecretArn
      RequireTLS: true
      VpcSubnetIds: !Ref PrivateSubnetIds
      VpcSecurityGroupIds:
        - !Ref ProxySecurityGroup

  ProxyTargets:
    Type: AWS::RDS::DBProxyTargetGroup
    DependsOn: [Writer, Reader]
    Properties:
      DBProxyName: !Ref Proxy
      TargetGroupName: default
      DBClusterIdentifiers:
        - !Ref Cluster

  ProxyReadOnlyEndpoint:
    Type: AWS::RDS::DBProxyEndpoint
    Properties:
      DBProxyName: !Ref Proxy
      DBProxyEndpointName: !Sub "nva-uac-${Environment}-read"
      TargetRole: READ_ONLY
      VpcSubnetIds: !Ref PrivateSubnetIds
      VpcSecurityGroupIds:
        - !Ref ProxySecurityGroup

  ProxyEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/ProxyEndpoint
      Type: String
      Value: !GetAtt Proxy.Endpoint

  ProxyReadOnlyEndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/ProxyReadOnlyEndpoint
      Type: String
      Value: !GetAtt ProxyReadOnlyEndpoint.Endpoint

  ProxyConnectResourceParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/ProxyConnectResource
      Type: String
      Value: !Sub
        - "arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${ProxyId}/*"
        - ProxyId: !Select [6, !Split [":", !GetAtt Proxy.DBProxyArn]]

  MigrationConnectPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >
        Lets the migration CodeBuild project connect through the proxy with an IAM authentication
        token. Attached to that project's role where the pipeline is defined.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: rds-db:connect
            Resource: !GetAtt ProxyConnectResourceParameter.Value

  MigrationConnectPolicyArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/MigrationConnectPolicyArn
      Type: String
      Value: !Ref MigrationConnectPolicy

  MasterUsernameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/MasterUsername
      Type: String
      Value: !Ref MasterUsername

  CredentialsSecretArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/CredentialsSecretArn
      Type: String
      Value: !GetAtt Cluster.MasterUserSecret.SecretArn

  DatabaseNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Database/Name
      Type: String
      Value: !Ref DatabaseName

  VpcIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Network/VpcId
      Type: String
      Value: !Ref VpcId

  ApplicationSecurityGroupParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Network/ApplicationSecurityGroupId
      Type: String
      Value: !Ref ApplicationSecurityGroup

  PrivateSubnetIdsParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /NVA/UAC/Network/PrivateSubnetIds
      Type: StringList
      Value: !Join [",", !Ref PrivateSubnetIds]

Outputs:
  ProxyEndpoint:
    Value: !GetAtt Proxy.Endpoint
  ClusterIdentifier:
    Value: !Ref Cluster
  CredentialsSecretArn:
    Description: The master credentials, read by the proxy only; callers authenticate with IAM tokens.
    Value: !GetAtt Cluster.MasterUserSecret.SecretArn
  MigrationConnectPolicyArn:
    Description: Attach to the migration CodeBuild project's role so it can connect through the proxy.
    Value: !Ref MigrationConnectPolicy
