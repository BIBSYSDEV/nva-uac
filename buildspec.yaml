version: 0.2

# The Build stage of the NVA CodePipeline (ADR 0005): build and test everything, lint the
# templates, package the application, and put the sources where the migration and rehearsal
# projects of the deployed stack read them. The CodeBuild project runs in privileged mode,
# because the tests start PostgreSQL in Docker.

env:
  variables:
    GRADLE_USER_HOME: "/root/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.configuration-cache=false"
    SAM_CLI_TELEMETRY: "0"
    TESTCONTAINERS_RYUK_DISABLED: "true"
    MIGRATION_SOURCE_KEY: nva-uac/migration-source.zip
cache:
  paths:
    - "/root/.gradle/caches/**/*"
reports:
  unit-tests:
    files:
      - "*/build/test-results/test/TEST-*.xml"
    file-format: JUNITXML
phases:
  install:
    runtime-versions:
      java: corretto25
    commands:
      - command -v sam >/dev/null 2>&1 || pip3 install aws-sam-cli
  build:
    commands:
      - ./gradlew build lintInfrastructure
      - zip --quiet --recurse-paths migration-source.zip . --exclude '.git/*' 'build/*' '*/build/*' '.gradle/*' '*/.gradle/*' '.aws-sam/*' 'fitness/*' 'packaged*.yaml'
      - SOURCE_VERSION=$(aws s3api put-object --bucket "$S3_BUCKET" --key "$MIGRATION_SOURCE_KEY" --body migration-source.zip --query VersionId --output text)
      - sam package --template-file template.yaml --s3-bucket "$S3_BUCKET" --output-template-file packaged_raw.yaml
      - export S3_BUCKET SOURCE_VERSION
      - envsubst '${S3_BUCKET} ${SOURCE_VERSION}' < packaged_raw.yaml > packaged.yaml
artifacts:
  files:
    - packaged.yaml
