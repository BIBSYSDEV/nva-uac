version: 0.2

# One rehearsal of the migration (D2), in the rehearsal project the application stack defines,
# inside the data tier's VPC, after the extract has filled the staging schema: load, reconcile,
# and keep the report as the build's artefact. The target tables must be empty; drop and migrate
# the schema first. Start it by hand:
#   aws codebuild start-build --project-name <stack>-rehearsal

env:
  variables:
    GRADLE_USER_HOME: "/root/.gradle"
    GRADLE_OPTS: "-Dorg.gradle.configuration-cache=false"
  parameter-store:
    PROXY_ENDPOINT: /NVA/UAC/Database/ProxyEndpoint
    DATABASE_NAME: /NVA/UAC/Database/Name
    DATABASE_USER: /NVA/UAC/Database/MasterUsername
cache:
  paths:
    - "/root/.gradle/caches/**/*"
phases:
  install:
    runtime-versions:
      java: corretto25
  build:
    commands:
      - export MIGRATION_URL="jdbc:postgresql://${PROXY_ENDPOINT}:5432/${DATABASE_NAME}?sslmode=require"
      - export MIGRATION_USER="$DATABASE_USER"
      - export MIGRATION_PASSWORD=$(aws rds generate-db-auth-token --hostname "$PROXY_ENDPOINT" --port 5432 --username "$DATABASE_USER" --region "$AWS_REGION")
      - ./gradlew :migration:loadUnits --quiet > rehearsal-units.md || REHEARSAL_FAILED=true
      - cat rehearsal-units.md
      - test "${REHEARSAL_FAILED:-false}" = false
artifacts:
  files:
    - rehearsal-units.md
