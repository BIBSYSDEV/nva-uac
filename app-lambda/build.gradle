plugins {
    id 'nva.uac.quarkus-conventions'
}

dependencies {
    implementation(project(':assembly'))
    implementation(libs.quarkus.amazon.lambda.http)
    // IAM authentication to RDS Proxy; on AWS only, so app-server stays free of the AWS SDK
    implementation(enforcedPlatform(libs.quarkus.amazon.services.bom))
    implementation(libs.quarkus.amazon.rds)
    implementation(libs.awssdk.url.connection.client)
    testImplementation(project(':test-support'))
    testImplementation(libs.quarkus.test.oidc.server)
    testImplementation(testFixtures(project(':adapter-persistence-postgres')))
}
