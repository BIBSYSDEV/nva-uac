quarkus.snapstart.enable=true
%test.quarkus.lambda.mock-event-server.test-port=0

# The prod profile is what the packaged function runs in every AWS environment, dev included.
# On AWS the datasource logs in to RDS Proxy with an IAM authentication token, not a password.
# Agroal asks the credentials provider for every new connection, and a token is only checked when
# a connection opens, so a 15-minute token never cuts an open connection.
%prod.quarkus.datasource.credentials-provider=proxy
%prod.quarkus.datasource.credentials-provider-name=rds-credentials-provider
%prod.quarkus.rds.credentials-provider.proxy.username=${quarkus.datasource.username}
%prod.quarkus.rds.credentials-provider.proxy.hostname=${UAC_DATABASE_HOST}
%prod.quarkus.rds.credentials-provider.proxy.port=5432
# One managed RDS client signs every token; without it the provider builds a new client each time
quarkus.rds.credentials-provider.proxy.use-quarkus-client=true
# Tokens are signed locally, so local runs and tests need no LocalStack
quarkus.rds.devservices.enabled=false

# The gateway has no authoriser (ADR 0006), so the function decides who gets in: a token from the
# backend client on every path, the health check and the OpenAPI document included, and no
# resource without a security annotation. AWS supplies the client; prod has no default, so a
# missing one stops the start.
quarkus.http.auth.permission.authenticated.paths=/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.security.jaxrs.deny-unannotated-endpoints=true
quarkus.oidc.token.required-claims.client_id=${UAC_CLIENT_ID}
%dev.UAC_CLIENT_ID=nva-backend-client
%test.UAC_CLIENT_ID=nva-backend-client
